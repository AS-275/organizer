<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer - School Assignment Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Theme Variables */
        :root[data-theme="light"] {
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --primary-accent: #3b82f6;
            --primary-hover: #2563eb;
            --hover-bg: #f1f5f9;
            --calendar-cell-bg: #ffffff;
            --calendar-other-month: #f8fafc;
            --shadow: 0 10px 25px -15px rgba(15, 23, 42, 0.2);
        }

        :root[data-theme="dark"] {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --primary-accent: #3b82f6;
            --primary-hover: #60a5fa;
            --hover-bg: #334155;
            --calendar-cell-bg: #1e293b;
            --calendar-other-month: #0f172a;
            --shadow: 0 12px 30px -18px rgba(15, 23, 42, 0.7);
        }

        :root[data-theme="lavender"] {
            --bg-color: #f3f0ff;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #2e1065;
            --text-secondary: #7e22ce;
            --border-color: #e9d5ff;
            --primary-accent: #8b5cf6;
            --primary-hover: #7c3aed;
            --hover-bg: #faf5ff;
            --calendar-cell-bg: #ffffff;
            --calendar-other-month: #f3f0ff;
            --shadow: 0 12px 28px -20px rgba(139, 92, 246, 0.25);
        }

        :root[data-theme="midnight"] {
            --bg-color: #090d16;
            --sidebar-bg: #111827;
            --card-bg: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #374151;
            --primary-accent: #6366f1;
            --primary-hover: #818cf8;
            --hover-bg: #374151;
            --calendar-cell-bg: #1f2937;
            --calendar-other-month: #111827;
            --shadow: 0 12px 30px -18px rgba(15, 23, 42, 0.85);
        }

        :root[data-theme="forest"] {
            --bg-color: #f0fdf4;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #052e16;
            --text-secondary: #166534;
            --border-color: #bbf7d0;
            --primary-accent: #10b981;
            --primary-hover: #059669;
            --hover-bg: #dcfce7;
            --calendar-cell-bg: #ffffff;
            --calendar-other-month: #f0fdf4;
            --shadow: 0 10px 25px -18px rgba(16, 185, 129, 0.25);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, rgba(59,130,246,0.10), transparent 30%),
                        radial-gradient(circle at bottom right, rgba(16,185,129,0.08), transparent 25%),
                        var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.2s, color 0.2s;
        }

        .theme-sidebar {
            background-color: var(--sidebar-bg);
            border-color: var(--border-color);
            box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.12);
        }

        .theme-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02));
            border-color: var(--border-color);
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
        }

        .theme-border { border-color: var(--border-color); }
        .theme-hover:hover { background-color: var(--hover-bg); }
        .theme-text-sec { color: var(--text-secondary); }
        .theme-accent { background-color: var(--primary-accent); }
        .theme-accent-text { color: var(--primary-accent); }

        nav button,
        .theme-card,
        .rounded-2xl,
        .rounded-xl,
        input,
        select,
        textarea,
        button,
        label {
            transition: all 0.2s ease;
        }

        nav button {
            border: 1px solid transparent;
        }

        nav button:hover {
            transform: translateX(2px);
        }

        nav button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        #mainContainer {
            padding-top: 0.5rem;
        }

        .tab-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.65);
            border-radius: 9999px;
        }

        /* Calendar Cell Min Height */
        .cal-day-cell {
            min-height: 120px;
            background-color: var(--calendar-cell-bg);
            border: 1px solid var(--border-color);
        }
        .cal-other-month {
            background-color: var(--calendar-other-month);
            opacity: 0.6;
        }

        /* Priority Badge Styles */
        .priority-high { background-color: #fee2e2; color: #991b1b; }
        .priority-med { background-color: #fef3c7; color: #92400e; }
        .priority-low { background-color: #e0e7ff; color: #3730a3; }
        
        [data-theme="dark"] .priority-high, [data-theme="midnight"] .priority-high { background-color: #7f1d1d; color: #fecaca; }
        [data-theme="dark"] .priority-med, [data-theme="midnight"] .priority-med { background-color: #78350f; color: #fef08a; }
        [data-theme="dark"] .priority-low, [data-theme="midnight"] .priority-low { background-color: #312e81; color: #c7d2fe; }
    </style>
</head>
